<!DOCTYPE html>
<html>
<head>
    <title>Bibliothek AG FES</title>
    <link rel="stylesheet" href="style.css">

<body>

<main>
    <div id="header">
            <div id="TitleBar">
                <img src="https://www.fesloe.de/site/assets/files/1031/logos-fesweb-loerrach.svg" alt="FES Logo" id="FES-Logo">
            </div>
        <div id="navBar">
            <a href="https://www.w3schools.com/tags/tag_a.asp"> Home</a>
            <a href="https://www.w3schools.com/css/css_comments.asp"> Bücher</a>

                <img id="bookTip1IMG" src="" alt="bookText">
                <div id="bookTip1Content" class="bookTipContent"></div>
            </div>
            <div class="bookTip" id="bookTip2">
                <div id="bookTip2Title" class="bookTipTitle"></div>
                <img id="bookTip2IMG" src="" alt="bookText">
                <div id="bookTip2Content" class="bookTipContent"></div>
            </div>
            <div id="arrowRight" class="arrow">></div>
        </div>
    </div>

<script src="code.js"></script>
